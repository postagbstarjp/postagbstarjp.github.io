<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc"><title id="title">格子法とSPH法の概念図</title><desc id="desc">格子法は空間の区画とその境界を通る流れを使う。SPH法は流れとともに移動する粒子と近傍の平滑化範囲を使う。実際の計算結果ではない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e5355"/></marker></defs><rect width="720" height="720" fill="#f7f5ef"/><g font-family="Yu Gothic, sans-serif" fill="#202729"><text x="36" y="45" font-size="23">格子法</text><text x="36" y="74" font-size="17">PLUTO / Athena++</text><text x="36" y="378" font-size="23">SPH法</text><text x="36" y="407" font-size="17">Phantom</text></g><g stroke="#a3afab" stroke-width="1"><path d="M 36 101 V 269"/><path d="M 78 101 V 269"/><path d="M 120 101 V 269"/><path d="M 162 101 V 269"/><path d="M 204 101 V 269"/><path d="M 246 101 V 269"/><path d="M 288 101 V 269"/><path d="M 330 101 V 269"/><path d="M 372 101 V 269"/><path d="M 414 101 V 269"/><path d="M 456 101 V 269"/><path d="M 36 101 H 456"/><path d="M 36 143 H 456"/><path d="M 36 185 H 456"/><path d="M 36 227 H 456"/><path d="M 36 269 H 456"/></g><g fill="#749d9a" fill-opacity=".22"><rect x="162" y="143" width="42" height="42"/><rect x="204" y="143" width="42" height="42"/><rect x="246" y="143" width="42" height="42"/></g><g stroke="#2e5355" stroke-width="2" marker-end="url(#arrow)"><path d="M 179 164 H 226"/><path d="M 221 206 H 268"/><path d="M 305 164 H 352"/></g><g font-family="Yu Gothic, sans-serif" font-size="17" fill="#202729"><text x="483" y="158">空間を区切る</text><text x="483" y="196">境界を通る流れ</text><text x="36" y="307">区画ごとの流体の状態を更新する</text></g><path d="M 36 335 H 684" stroke="#d7d5cd"/><circle cx="246" cy="511" r="65" fill="#749d9a" fill-opacity=".12" stroke="#2e5355" stroke-dasharray="5 5"/><circle cx="48.0" cy="459.0" r="4.5" fill="#547f7c"/><circle cx="95.9" cy="455.8" r="4.5" fill="#547f7c"/><circle cx="130.5" cy="449.1" r="4.5" fill="#547f7c"/><circle cx="168.4" cy="445.1" r="4.5" fill="#547f7c"/><circle cx="219.0" cy="447.4" r="4.5" fill="#547f7c"/><circle cx="262.8" cy="454.0" r="4.5" fill="#547f7c"/><circle cx="295.8" cy="458.7" r="4.5" fill="#547f7c"/><circle cx="338.3" cy="457.3" r="4.5" fill="#547f7c"/><circle cx="389.2" cy="451.0" r="4.5" fill="#547f7c"/><circle cx="428.4" cy="445.6" r="4.5" fill="#547f7c"/><circle cx="62.0" cy="492.8" r="4.5" fill="#547f7c"/><circle cx="101.6" cy="486.1" r="4.5" fill="#547f7c"/><circle cx="135.3" cy="482.1" r="4.5" fill="#547f7c"/><circle cx="181.9" cy="484.4" r="4.5" fill="#547f7c"/><circle cx="231.0" cy="491.0" r="4.5" fill="#547f7c"/><circle cx="266.5" cy="495.7" r="4.5" fill="#547f7c"/><circle cx="303.1" cy="494.3" r="4.5" fill="#547f7c"/><circle cx="353.0" cy="488.0" r="4.5" fill="#547f7c"/><circle cx="398.4" cy="482.6" r="4.5" fill="#547f7c"/><circle cx="431.7" cy="483.1" r="4.5" fill="#547f7c"/><circle cx="53.5" cy="523.1" r="4.5" fill="#547f7c"/><circle cx="86.8" cy="519.1" r="4.5" fill="#547f7c"/><circle cx="127.4" cy="521.4" r="4.5" fill="#547f7c"/><circle cx="178.4" cy="528.0" r="4.5" fill="#547f7c"/><circle cx="219.5" cy="532.7" r="4.5" fill="#547f7c"/><circle cx="252.7" cy="531.3" r="4.5" fill="#547f7c"/><circle cx="297.9" cy="525.0" r="4.5" fill="#547f7c"/><circle cx="347.8" cy="519.6" r="4.5" fill="#547f7c"/><circle cx="384.6" cy="520.1" r="4.5" fill="#547f7c"/><circle cx="420.0" cy="526.0" r="4.5" fill="#547f7c"/><circle cx="57.8" cy="556.1" r="4.5" fill="#547f7c"/><circle cx="93.0" cy="558.4" r="4.5" fill="#547f7c"/><circle cx="141.7" cy="565.0" r="4.5" fill="#547f7c"/><circle cx="188.8" cy="569.7" r="4.5" fill="#547f7c"/><circle cx="222.8" cy="568.3" r="4.5" fill="#547f7c"/><circle cx="261.7" cy="562.0" r="4.5" fill="#547f7c"/><circle cx="312.6" cy="556.6" r="4.5" fill="#547f7c"/><circle cx="355.3" cy="557.1" r="4.5" fill="#547f7c"/><circle cx="388.3" cy="563.0" r="4.5" fill="#547f7c"/><circle cx="431.9" cy="56