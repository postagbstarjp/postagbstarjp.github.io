<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">図2　光の地図と、物質の地図の間にある条件</title><desc id="desc">光学線、分子線、連続波がそれぞれ異なる条件へ感度を持つことを示す概念図。実測の分布を描いたものではない。空間分解能と感度の差を確認し、複数の成分が重なっているかを速度も用いて調べてから、形態形成や質量分布を議論する。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2e5355"/></marker></defs><rect width="100%" height="100%" fill="#fbf8f1"/><g font-family="Yu Gothic, Noto Sans CJK JP, sans-serif" font-size="23" fill="#263c3d" stroke-linecap="round"><text x="500" y="42" font-size="28" text-anchor="middle">異なる放射は、同じ物質を同じ重みでは見ない</text><rect x="60" y="100" width="270" height="135" rx="5" fill="#eee8da" stroke="#79928b"/><text x="195.0" y="137" font-size="23" text-anchor="middle">光学の輝線</text><text x="195.0" y="170" font-size="23" text-anchor="middle">電離・励起したガス</text><text x="195.0" y="203" font-size="23" text-anchor="middle">密度と温度にも依存</text><rect x="365" y="100" width="270" height="135" rx="5" fill="#eee8da" stroke="#79928b"/><text x="500.0" y="137" font-size="23" text-anchor="middle">分子の回転線</text><text x="500.0" y="170" font-size="23" text-anchor="middle">冷たい中性成分</text><text x="500.0" y="203" font-size="23" text-anchor="middle">励起・存在量に依存</text><rect x="670" y="100" width="270" height="135" rx="5" fill="#eee8da" stroke="#79928b"/><text x="805.0" y="137" font-size="23" text-anchor="middle">赤外・ミリ波連続波</text><text x="805.0" y="170" font-size="23" text-anchor="middle">ダストなどの成分</text><text x="805.0" y="203" font-size="23" text-anchor="middle">温度・不透明度に依存</text><line x1="195" y1="250" x2="195" y2="295" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><line x1="500" y1="250" x2="500" y2="295" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><line x1="805" y1="250" x2="805" y2="295" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="310" width="820" height="70" rx="5" fill="#eee8da" stroke="#79928b"/><text x="500.0" y="347" font-size="23" text-anchor="middle">同じ天体・座標・感度・角分解能・速度成分を確認して比較</text><text x="500" y="427" font-size="22" text-anchor="middle">明るい場所の一致・不一致を、質量の一致・不一致と即断しない</text></g></svg>