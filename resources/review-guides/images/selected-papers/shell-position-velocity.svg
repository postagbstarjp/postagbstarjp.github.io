<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">図2　位置と視線速度を組み合わせると、投影を試せる</title><desc id="desc">薄い等速球殻で、中心を通る切断面の位置と視線速度を計算した幾何モデル。Rは殻半径、vexpは膨張速度、vLOSは系統速度からのずれ。楕円は可能な位置・速度の関係で、実測の輝度分布ではない。励起やビーミングで楕円全体が見えるとは限らず、加速・非球対称・厚い殻では関係が変わる。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2e5355"/></marker></defs><rect width="100%" height="100%" fill="#fbf8f1"/><g font-family="Yu Gothic, Noto Sans CJK JP, sans-serif" font-size="23" fill="#263c3d" stroke-linecap="round"><text x="500" y="42" font-size="28" text-anchor="middle">薄い・等速・球対称の殻だけを仮定した例</text><line x1="140" y1="230" x2="860" y2="230" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><line x1="500" y1="380" x2="500" y2="90" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><ellipse cx="500" cy="230" rx="280" ry="120" fill="none" stroke="#b36d45" stroke-width="4"/><text x="500" y="395" font-size="24" text-anchor="middle">投影した中心からの位置  b / R</text><text x="220" y="264" font-size="20" text-anchor="middle">−1</text><text x="500" y="264" font-size="20" text-anchor="middle">0</text><text x="780" y="264" font-size="20" text-anchor="middle">+1</text><text x="520" y="100" font-size="20" text-anchor="start">+1</text><text x="520" y="355" font-size="20" text-anchor="start">−1</text><text x="120" y="90" font-size="22" text-anchor="start">vLOS / vexp</text><text x="500" y="440" font-size="22" text-anchor="middle">(b/R)² + (vLOS/vexp)² = 1　　系統速度を差し引いた場合</text></g></svg>