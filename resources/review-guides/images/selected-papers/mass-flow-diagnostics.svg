<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">図2　測定量から質量放出率へ進む道筋</title><desc id="desc">観測手法が直接測る量と、質量放出率Ṁを導く仮定を分けた概念図。式は球対称・定常流での質量保存であり、rは半径、ρはガス密度、vは流速。塊状・非球対称・時間変動する流れでは、この式へ観測量をそのまま代入して十分とは限らない。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2e5355"/></marker></defs><rect width="100%" height="100%" fill="#fbf8f1"/><g font-family="Yu Gothic, Noto Sans CJK JP, sans-serif" font-size="23" fill="#263c3d" stroke-linecap="round"><text x="500" y="42" font-size="28" text-anchor="middle">一つの質量流量を、異なる観測から制約する</text><rect x="45" y="92" width="260" height="102" rx="5" fill="#eee8da" stroke="#79928b"/><text x="175.0" y="129" font-size="23" text-anchor="middle">COなどの線放射</text><text x="175.0" y="162" font-size="23" text-anchor="middle">強度・線幅・像</text><rect x="370" y="92" width="260" height="102" rx="5" fill="#eee8da" stroke="#79928b"/><text x="500.0" y="129" font-size="23" text-anchor="middle">赤外線とダスト</text><text x="500.0" y="162" font-size="23" text-anchor="middle">SED・帯・光学的厚さ</text><rect x="695" y="92" width="260" height="102" rx="5" fill="#eee8da" stroke="#79928b"/><text x="825.0" y="129" font-size="23" text-anchor="middle">電波光球・メーザー</text><text x="825.0" y="162" font-size="23" text-anchor="middle">温度・位置・時間変化</text><line x1="175" y1="200" x2="380" y2="265" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><line x1="500" y1="200" x2="500" y2="265" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><line x1="825" y1="200" x2="620" y2="265" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><rect x="240" y="280" width="520" height="75" rx="5" fill="#eee8da" stroke="#79928b"/><text x="500.0" y="317" font-size="23" text-anchor="middle">球対称・定常なら  Ṁ = 4πr²ρv</text><text x="500" y="405" font-size="24" text-anchor="middle">距離・存在量・励起・幾何・速度の仮定を照合する</text></g></svg>