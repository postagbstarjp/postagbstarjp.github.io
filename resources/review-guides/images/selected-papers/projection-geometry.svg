<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">図1　同じ三次元形状でも、投影した輪郭は変わる</title><desc id="desc">長軸と短軸の比が3の回転楕円体を、長軸から0°・45°・90°の方向で見た幾何学的な輪郭。長軸方向からは円形に見える。これは特定の星雲の観測やSHAPEモデルの再現ではなく、投影だけの効果を切り出した独立計算である。実際の星雲では電離・密度・感度・視野も見え方を変える。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2e5355"/></marker></defs><rect width="100%" height="100%" fill="#fbf8f1"/><g font-family="Yu Gothic, Noto Sans CJK JP, sans-serif" font-size="23" fill="#263c3d" stroke-linecap="round"><text x="500" y="42" font-size="28" text-anchor="middle">同じ回転楕円体を、違う方向から見る</text><ellipse cx="175" cy="225" rx="55.000" ry="55" fill="#d5e3dc" stroke="#2e5355" stroke-width="3"/><text x="175" y="342" font-size="22" text-anchor="middle">長軸との視線角 0°</text><ellipse cx="500" cy="225" rx="122.984" ry="55" fill="#d5e3dc" stroke="#2e5355" stroke-width="3"/><text x="500" y="342" font-size="22" text-anchor="middle">長軸との視線角 45°</text><ellipse cx="825" cy="225" rx="165.000" ry="55" fill="#d5e3dc" stroke="#2e5355" stroke-width="3"/><text x="825" y="342" font-size="22" text-anchor="middle">長軸との視線角 90°</text><text x="500" y="412" font-size="21" text-anchor="middle">長軸／短軸 = 3。表面の輪郭のみ。放射輸送・速度・ダストは含まない。</text></g></svg>