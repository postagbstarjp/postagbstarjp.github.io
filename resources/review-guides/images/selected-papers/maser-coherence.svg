<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">図1　メーザーのリングは、増幅の選択も映す</title><desc id="desc">殻の形と、速度がそろった長い光路を区別する独立模式図。内側の加速する大気では接線方向が有利になることがあるが、全てのメーザー・半径で同じとは限らない。輝点の分布はガス密度の輪郭そのものではなく、励起、速度勾配、種放射、飽和にも選ばれる。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2e5355"/></marker></defs><rect width="100%" height="100%" fill="#fbf8f1"/><g font-family="Yu Gothic, Noto Sans CJK JP, sans-serif" font-size="23" fill="#263c3d" stroke-linecap="round"><text x="500" y="42" font-size="28" text-anchor="middle">増幅されやすい光路は、速度のそろい方で変わる</text><circle cx="310" cy="240" r="125" fill="#e1e9e2" stroke="#79928b" stroke-width="2"/><circle cx="310" cy="240" r="95" fill="#fbf8f1" stroke="#79928b" stroke-width="2"/><circle cx="310" cy="240" r="38" fill="#d7b16d"/><line x1="130" y1="145" x2="610" y2="145" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><line x1="355" y1="240" x2="610" y2="240" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><text x="760" y="150" font-size="25" text-anchor="middle">接線に近い光路</text><text x="760" y="185" font-size="20" text-anchor="middle">視線速度の変化が小さい場合</text><text x="760" y="252" font-size="25" text-anchor="middle">動径に近い光路</text><text x="760" y="287" font-size="20" text-anchor="middle">加速による速度勾配の影響</text><text x="310" y="245" font-size="23" text-anchor="middle">星</text><text x="500" y="425" font-size="22" text-anchor="middle">模式図。励起・飽和・幾何により有利な光路は変わる。</text></g></svg>