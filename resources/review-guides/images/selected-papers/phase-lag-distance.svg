<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">図3　位相遅れ法は、時間差と角サイズを結ぶ</title><desc id="desc">中心の変化に応答する薄い球殻では、奥側からの光は手前側よりおよそ殻直径分だけ長い距離を進む。赤・青ピークの遅れΔtから線形直径cΔtを推定し、角直径θと比較する。独立模式図で、殻が厚い・非球対称、異なる場所が応答する、周期の対応が曖昧、といった場合にはこの近似が偏る。メーザーが常にどちらの端でも検出されることを保証する図ではない。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2e5355"/></marker></defs><rect width="100%" height="100%" fill="#fbf8f1"/><g font-family="Yu Gothic, Noto Sans CJK JP, sans-serif" font-size="23" fill="#263c3d" stroke-linecap="round"><text x="500" y="42" font-size="28" text-anchor="middle">同じ増光が、殻の手前と奥へ伝わる</text><circle cx="430" cy="220" r="115" fill="none" stroke="#79928b" stroke-width="4"/><circle cx="430" cy="220" r="28" fill="#d7b16d"/><line x1="430" y1="220" x2="315" y2="220" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><line x1="430" y1="220" x2="545" y2="220" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><line x1="315" y1="285" x2="100" y2="285" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><line x1="545" y1="325" x2="100" y2="325" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><text x="95" y="230" font-size="22" text-anchor="middle">観測者</text><text x="310" y="100" font-size="22" text-anchor="middle">手前：青方側</text><text x="570" y="100" font-size="22" text-anchor="middle">奥：赤方側</text><rect x="650" y="155" width="300" height="130" rx="5" fill="#eee8da" stroke="#79928b"/><text x="800.0" y="192" font-size="23" text-anchor="middle">薄い球殻なら</text><text x="800.0" y="225" font-size="23" text-anchor="middle">直径 ≈ c Δt</text><text x="800.0" y="258" font-size="23" text-anchor="middle">距離 ≈ c Δt / θ</text><text x="500" y="414" font-size="22" text-anchor="middle">Δt：赤・青ピークの遅れ　θ：殻の角直径（ラジアン）</text></g></svg>