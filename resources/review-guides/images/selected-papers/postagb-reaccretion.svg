<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">図3　元素欠乏を、円盤からの再降着と結ぶ</title><desc id="desc">難揮発性元素がダスト側に保持され、ガスが星へ戻るという解釈を、観測される組成の偏りと分けて示した独立概念図。実際の流路、分離効率、円盤寿命を測定した図ではない。惑星などの第三天体は分離機構の候補であり、この図にも確定した構成要素としては描いていない。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2e5355"/></marker></defs><rect width="100%" height="100%" fill="#fbf8f1"/><g font-family="Yu Gothic, Noto Sans CJK JP, sans-serif" font-size="23" fill="#263c3d" stroke-linecap="round"><text x="500" y="42" font-size="28" text-anchor="middle">表面の元素欠乏へ至る、一つの物理的解釈</text><rect x="40" y="110" width="260" height="100" rx="5" fill="#eee8da" stroke="#79928b"/><text x="170.0" y="147" font-size="23" text-anchor="middle">連星を囲む円盤</text><text x="170.0" y="180" font-size="23" text-anchor="middle">ガスとダスト</text><rect x="370" y="110" width="260" height="100" rx="5" fill="#eee8da" stroke="#79928b"/><text x="500.0" y="147" font-size="23" text-anchor="middle">ダストの保持</text><text x="500.0" y="180" font-size="23" text-anchor="middle">難揮発性元素を捕える</text><rect x="700" y="110" width="260" height="100" rx="5" fill="#eee8da" stroke="#79928b"/><text x="830.0" y="147" font-size="23" text-anchor="middle">ガスの再降着</text><text x="830.0" y="180" font-size="23" text-anchor="middle">主星の表面を変える</text><line x1="305" y1="160" x2="360" y2="160" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><line x1="635" y1="160" x2="690" y2="160" stroke="#2e5355" stroke-width="3" marker-end="url(#arrow)"/><rect x="160" y="285" width="680" height="95" rx="5" fill="#eee8da" stroke="#79928b"/><text x="500.0" y="322" font-size="23" text-anchor="middle">観測：凝縮温度に応じた元素存在量の偏り</text><text x="500.0" y="355" font-size="23" text-anchor="middle">推定：分離・再降着・元の組成と混合の寄与</text><text x="500" y="425" font-size="20" text-anchor="middle">円盤空洞や元素欠乏だけで、惑星や全ての流路が確定するわけではない</text></g></svg>