<svg xmlns="http://www.w3.org/2000/svg" width="800" height="740" viewBox="0 0 800 740" role="img" aria-labelledby="title desc">
<title id="title">球状風、螺旋、赤道構造と双極流</title><desc id="desc">三つの模式図は独立した例で、必ず通る進化順序ではない。伴星の重力は螺旋を作り得る。赤道の密度と流出の方向は投影像から一意に決まらない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#386668"/></marker><radialGradient id="star"><stop stop-color="#fff2c9"/><stop offset="1" stop-color="#c17b49"/></radialGradient></defs>
<rect width="800" height="740" rx="8" fill="#f0eee6"/>
<g font-family="Yu Gothic, Meiryo, sans-serif" fill="#243c3e" font-size="23">
<text x="42" y="55" font-size="27" font-weight="bold">形と成因を、一対一に対応させない</text>
<text x="42" y="92" font-size="19">独立した三つの例・進化の順序を示す図ではない</text>
<g fill="none" stroke="#80978e" stroke-width="2"><circle cx="190" cy="203" r="37"/><circle cx="190" cy="203" r="62"/><circle cx="190" cy="203" r="87"/></g>
<circle cx="190" cy="203" r="12" fill="#bd8752"/>
<text x="365" y="173" font-weight="bold">球状に近い風</text><text x="365" y="212">まず比較の基準にする</text><text x="365" y="245" font-size="20">不均一性が重なる場合もある</text>
