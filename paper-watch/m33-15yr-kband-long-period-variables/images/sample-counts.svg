<svg xmlns="http://www.w3.org/2000/svg" width="620" height="398" viewBox="0 0 620 398" role="img" aria-labelledby="title desc">
  <title id="title">二つの標本と候補の数</title>
  <desc id="desc">Kバンド標本847のうち771が変光星、385がミラ型候補。Spitzer対応156のうち120が塵に覆われたAGB星の候補。</desc>
  <rect width="620" height="398" fill="#f6f7fa"/>
  <g font-family="system-ui, sans-serif" fill="#172a3b">
    <rect x="22" y="20" width="576" height="190" rx="12" fill="#e6eef5"/>
    <rect x="22" y="230" width="576" height="148" rx="12" fill="#e7f0ed"/>
    <g font-size="28" font-weight="700">
      <text x="44" y="64">Kバンド標本</text><text x="573" y="64" text-anchor="end">847</text>
      <text x="44" y="273">Spitzer対応天体</text><text x="573" y="273" text-anchor="end">156</text>
    </g>
    <path d="M44 82h529 M44 292h529" stroke="#97aebd"/>
    <g font-size="26">
      <text x="44" y="120">変光星</text><text x="573" y="120" text-anchor="end">771</text>
      <text x="64" y="169">うちミラ型候補</text><text x="573" y="169" text-anchor="end">385</text>
      <text x="44" y="333">塵に覆われたAGB星候補</text><text x="573" y="333" text-anchor="end">120</text>
    </g>
  </g>
</svg>
