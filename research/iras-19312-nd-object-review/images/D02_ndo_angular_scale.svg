<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="780" viewBox="0 0 1450 780" role="img" aria-labelledby="figtitle figdesc"><title id="figtitle">NDOの角度スケールの換算</title><desc id="figdesc">D=3.8kpcで角度0.01秒から60秒を線形サイズに換算した概念図。</desc><rect width="100%" height="100%" fill="#F9F8F4"/>
<style>text{font-family:Noto Sans CJK JP, Yu Gothic, sans-serif;fill:#26383A;} .title{font-size:35px;font-weight:700}.sub{font-size:20px;fill:#607174}.label{font-size:23px;font-weight:650}.small{font-size:19px;fill:#607174}.tiny{font-size:17px;fill:#607174}</style>
<text x="70" y="89" class="title" text-anchor="start" >同じ天体でも、観測する空間スケールは大きく異なる</text><text x="72" y="132" class="sub" text-anchor="start" >距離 D = 3.80 kpc を仮定した角度と線形サイズの換算（投影長・直径の目安）</text><text x="495" y="185" class="small" text-anchor="start" >角度（対数目盛）</text><line x1="495" y1="220" x2="1160" y2="220" stroke="#E0E4E0" stroke-width="2"/><line x1="495" y1="215" x2="495" y2="226" stroke="#607174"/><text x="495" y="250" class="tiny" text-anchor="middle" >0.01″</text><line x1="661" y1="215" x2="661" y2="226" stroke="#607174"/><text x="661" y="250" class="tiny" text-anchor="middle" >0.1″</text><line x1="828" y1="215" x2="828" y2="226" stroke="#607174"/><text x="828" y="250" class="tiny" text-anchor="middle" >1″</text><line x1="994" y1="215" x2="994" y2="226" stroke="#607174"/><text x="994" y="250" class="tiny" text-anchor="middle" >10″</text><line x1="1160" y1="215" x2="1160" y2="226" stroke="#607174"/><text x="1160" y="250" class="tiny" text-anchor="middle" >100″</text><text x="72" y="318" class="label" text-anchor="start" >0.01″</text><text x="166" y="318" class="small" text-anchor="start" >VLBI級の細部</text><line x1="495" y1="310" x2="495.0" y2="310" stroke="#2D6265" stroke-width="9" stroke-linecap="round"/><circle cx="495.0" cy="310" r="10" fill="#2D6265"/><text x="1335" y="318" class="label" text-anchor="end" >0.00018 pc</text><text x="72" y="382" class="label" text-anchor="start" >1″</text><text x="166" y="382" class="small" text-anchor="start" >高分解能マップ</text><line x1="495" y1="374" x2="827.5" y2="374" stroke="#2D6265" stroke-width="9" stroke-linecap="round"/><circle cx="827.5" cy="374" r="10" fill="#2D6265"/><text x="1335" y="382" class="label" text-anchor="end" >0.018 pc</text><text x="72" y="446" class="label" text-anchor="start" >3″</text><text x="166" y="446" class="small" text-anchor="start" >中心近傍</text><line x1="495" y1="438" x2="906.8" y2="438" stroke="#2D6265" stroke-width="9" stroke-linecap="round"/><circle cx="906.8" cy="438" r="10" fill="#2D6265"/><text x="1335" y="446" class="label" text-anchor="end" >0.055 pc</text><text x="72" y="510" class="label" text-anchor="start" >10″</text><text x="166" y="510" class="small" text-anchor="start" >近赤外・コア周辺</text><line x1="495" y1="502" x2="993.8" y2="502" stroke="#2D6265" stroke-width="9" stroke-linecap="round"/><circle cx="993.8" cy="502" r="10" fill="#2D6265"/><text x="1335" y="510" class="label" text-anchor="end" >0.184 pc</text><text x="72" y="574" class="label" text-anchor="start" >24″</text><text x="166" y="574" class="small" text-anchor="start" >ダスト雲の代表開口</text><line x1="495" y1="566" x2="1057.0" y2="566" stroke="#2D6265" stroke-width="9" stroke-linecap="round"/><circle cx="1057.0" cy="566" r="10" fill="#2D6265"/><text x="1335" y="574" class="label" text-anchor="end" >0.442 pc</text><text x="72" y="638" class="label" text-anchor="start" >60″</text><text x="166" y="638" class="small" text-anchor="start" >広域の分子雲</text><line x1="495" y1="630" x2="1123.1" y2="630" stroke="#2D6265" stroke-width="9" stroke-linecap="round"/><circle cx="1123.1" cy="630" r="10" fill="#2D6265"/><text x="1335" y="638" class="label" text-anchor="end" >1.105 pc</text><line x1="72" y1="717" x2="1380" y2="717" stroke="#E0E4E0"/><text x="72" y="749" class="tiny" text-anchor="start" >換算：1″ = 3,800 au ≈ 0.0184 pc。各行は特定の構造の実測直径を主張するものではありません。</text></svg>