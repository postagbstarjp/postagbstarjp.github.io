<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="820" viewBox="0 0 1450 820" role="img" aria-labelledby="figtitle figdesc"><title id="figtitle">NDO中心天体と周辺環境</title><desc id="figdesc">中心天体の起源の仮説と周辺雲の起源の仮説を分ける図。</desc><rect width="100%" height="100%" fill="#F9F8F4"/>
<style>text{font-family:Noto Sans CJK JP, Yu Gothic, sans-serif;fill:#26383A;} .title{font-size:35px;font-weight:700}.sub{font-size:20px;fill:#607174}.label{font-size:23px;font-weight:650}.small{font-size:19px;fill:#607174}.tiny{font-size:17px;fill:#607174}</style>
<text x="70" y="88" class="title" text-anchor="start" >研究上の核心：二つの問いを区別する</text><text x="72" y="134" class="sub" text-anchor="start" >周囲の分子雲の性質と中心天体の進化史は、別々に検証する必要があります。</text><rect x="86" y="213" width="599" height="352" rx="18" fill="#FFFFFF" stroke="#E0E4E0" stroke-width="1.5"/><rect x="765" y="213" width="599" height="352" rx="18" fill="#FFFFFF" stroke="#E0E4E0" stroke-width="1.5"/><text x="115" y="263" class="label" text-anchor="start" >問い A 　中心の光源は何者か</text><text x="115" y="315" class="small" text-anchor="start" >候補：AGB / post-AGB、RSG、大質量YSO</text><text x="115" y="351" class="small" text-anchor="start" >　　　恒星合体残骸（RNR）など</text><text x="115" y="416" class="label" text-anchor="start" >検証する証拠</text><text x="115" y="457" class="small" text-anchor="start" >メーザー位置・運動／中心星光度・温度</text><text x="115" y="492" class="small" text-anchor="start" >高分解能連続波／周期変動・進化の履歴</text><text x="792" y="263" class="label" text-anchor="start" >問い B 　周囲の物質は何に由来するか</text><text x="792" y="315" class="small" text-anchor="start" >候補：星間分子雲、星周放出物、両者の混合</text><text x="792" y="416" class="label" text-anchor="start" >検証する証拠</text><text x="792" y="457" class="small" text-anchor="start" >CO・ダストの広がり／重水素化分子</text><text x="792" y="492" class="small" text-anchor="start" >SMAコア／分子線速度場・アウトフロー</text><path d="M685 387 L765 387" stroke="#2D6265" stroke-width="3" stroke-dasharray="9,8"/><path d="M765 387 l-14 -9 v18 z" fill="#2D6265"/><path d="M685 387 l14 -9 v18 z" fill="#2D6265"/><rect x="165" y="616" width="1118" height="88" rx="14" fill="#EDF3F0" stroke="#C5DAD3" stroke-width="1.5"/><text x="190" y="652" class="label" text-anchor="start" >重要な論理的注意</text><text x="190" y="684" class="small" text-anchor="start" >星形成的な周辺環境の証拠だけで、中心天体の起源が一意に確定するわけではありません。</text><text x="72" y="760" class="tiny" text-anchor="start" >本図は論点整理のオリジナル概念図であり、観測データを画像化したものではありません。</text></svg>